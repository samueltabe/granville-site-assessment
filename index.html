<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Granville Energy — SiteScope Site Assessment</title>
  <link rel="icon" href="img/icon.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img id="headerLogo" src="./img/logoblack.png" alt="Granville Energy" width="188" height="40" decoding="async">
    </div>
    <div class="top-actions">
      <div class="title-block">
        <h1>SiteScope Site Assessment Form v1.1</h1>
        <p>Granville Energy — site assessment capture</p>
      </div>
      <div class="topbar-tools">
        <div class="progress-wrap" aria-live="polite">
          <div class="progress-meta">
            <span>Visible required fields</span>
            <span id="progressText">0%</span>
          </div>
          <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        </div>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode">
          <svg class="theme-toggle-icon theme-toggle-moon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <aside>
      <div class="nav-label">Sections</div>
      <div id="nav"></div>
    </aside>

    <main>
      <form id="siteAssessmentForm" data-submit-endpoint="https://installer.granville-energy.com/api/site-assessments" novalidate>
        <div class="form-stage" id="sections"></div>
        <div class="sticky-actions">
          <button type="button" class="ghost-btn" id="prevBtn">Back</button>
          <button type="button" class="primary-btn" id="nextBtn">Next</button>
        </div>
      </form>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="./form-builder.js"></script>
  <script src="./script.js"></script>
</body>
</html>
